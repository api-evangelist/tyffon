name: Tyffon
description: Tyffon Inc. is a Japanese immersive entertainment company that combines
  creativity and technology to deliver memorable XR experiences. The studio builds
  VR, AR, and mixed-reality attractions - including Corridor, Kaiju Haven VR, Floria,
  and Island Mirrorge MR - operates the Tyffonium attraction brand, licenses its XR
  content to entertainment venues across Japan, and released the GARA AR platform
  app. A Techstars portfolio company, Tyffon publishes no public developer portal
  or API surface as of July 2026.
